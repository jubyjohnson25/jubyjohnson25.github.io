<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Examples — Infineon Developer Zone</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:    #009B3A;
  --green-lt: #e8f7ee;
  --green-dk: #007A2F;
  --text:     #1a1a1a;
  --text-mid: #555;
  --text-lt:  #888;
  --border:   #e0e0e0;
  --bg:       #f7f8f9;
  --white:    #ffffff;
  --tag-bg:   #f0f0f0;
  --radius:   6px;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; }

/* ── Header ───────────────────────────────────────── */
header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 32px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.logo-mark {
  width: 28px;
  height: 28px;
  background: var(--green);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-mark svg { fill: white; }

.logo-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}
.logo-text span { color: var(--green); }

.header-divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  max-width: 540px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px 0 36px;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--green); background: white; }
.search-wrap input::placeholder { color: var(--text-lt); }

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-lt);
  pointer-events: none;
  font-size: 14px;
}

.result-count-header {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-lt);
  flex-shrink: 0;
}

/* ── Page layout ──────────────────────────────────── */
.page {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 56px);
}

/* ── Sidebar ──────────────────────────────────────── */
aside {
  background: var(--white);
  border-right: 1px solid var(--border);
  padding: 12px 0;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}

.sidebar-section {
  padding: 0 14px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-section:last-child { border-bottom: none; }

.sidebar-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-lt);
  padding: 10px 0 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-label button {
  font-size: 10px;
  font-weight: 600;
  color: var(--green);
  background: none;
  border: none;
  padding: 0;
  text-transform: none;
  letter-spacing: 0;
  display: none;
}
.sidebar-label button.visible { display: block; }

.level-row {
  margin-bottom: 6px;
}
.level-row label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-lt);
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.level-row select {
  width: 100%;
  font-size: 12px;
  font-family: inherit;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: white;
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.level-row select:focus { border-color: var(--green); }
.level-row select:disabled { background: var(--bg); color: var(--text-lt); cursor: default; }

/* Board filter */
.board-search {
  width: 100%;
  font-size: 12px;
  font-family: inherit;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: white;
  color: var(--text);
  outline: none;
  margin-bottom: 6px;
}
.board-search:focus { border-color: var(--green); }

.filter-list { list-style: none; display: flex; flex-direction: column; gap: 1px; }
.filter-list-scroll { max-height: 180px; overflow-y: auto; }

.filter-item label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 4px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text);
  transition: background 0.1s;
  user-select: none;
}
.filter-item label:hover { background: var(--bg); }
.filter-item input[type="checkbox"] { display: none; }

.checkmark {
  width: 15px;
  height: 15px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
  background: white;
}
.filter-item input:checked + label .checkmark {
  background: var(--green);
  border-color: var(--green);
}
.filter-item input:checked + label .checkmark::after {
  content: '';
  display: block;
  width: 8px;
  height: 4px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px, -1px);
}
.filter-item input:checked + label { color: var(--green-dk); font-weight: 500; }

.filter-count {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-lt);
  font-weight: 400;
}

/* ── Main content ─────────────────────────────────── */
main { padding: 20px 28px 40px; }

.active-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 28px;
  margin-bottom: 12px;
}

.filter-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px 3px 10px;
  background: var(--green-lt);
  border: 1px solid #b2ddc4;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  color: var(--green-dk);
}
.filter-chip .chip-remove {
  background: none;
  border: none;
  padding: 0;
  line-height: 1;
  color: var(--green);
  font-size: 14px;
  display: flex;
  align-items: center;
  opacity: 0.7;
}
.filter-chip .chip-remove:hover { opacity: 1; }

.clear-all {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-lt);
  background: none;
  border: none;
  padding: 2px 4px;
  border-radius: 4px;
  margin-left: 4px;
}
.clear-all:hover { color: var(--text); background: var(--bg); }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.toolbar-left { font-size: 13px; color: var(--text-mid); }
.toolbar-left strong { color: var(--text); }

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.toolbar-right label {
  font-size: 12px;
  color: var(--text-lt);
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
#hideArchived { accent-color: var(--green); }

.sort-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sort-wrap label { font-size: 12px; color: var(--text-lt); }
.sort-wrap select {
  font-size: 12px;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 8px;
  background: white;
  color: var(--text);
  outline: none;
  cursor: pointer;
}

/* Result grid */
.results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* Card */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover {
  border-color: #b0d4be;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card.archived { opacity: 0.55; }

.card-top { display: flex; align-items: flex-start; gap: 10px; }

.card-icon {
  width: 30px;
  height: 30px;
  border-radius: 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
}

.card-title-wrap { flex: 1; min-width: 0; }

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-org { font-size: 11px; color: var(--text-lt); margin-top: 1px; }

.card-desc {
  font-size: 12px;
  color: var(--text-mid);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }

.tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 500;
  line-height: 1.6;
}
.tag-app     { background: #eef2ff; color: #3730a3; }
.tag-product { background: #fef3c7; color: #92400e; }
.tag-board   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.tag-lang    { background: var(--tag-bg); color: var(--text-mid); }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px solid var(--bg);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-lt);
}
.card-meta span { display: flex; align-items: center; gap: 3px; }

.btn-github {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-mid);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.btn-github:hover {
  background: var(--text);
  border-color: var(--text);
  color: white;
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
}
.pagination button {
  font-size: 12px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--text);
}
.pagination button:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.pagination button:disabled { opacity: 0.4; cursor: default; }
.pagination .page-info { font-size: 12px; color: var(--text-lt); }

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-lt);
}
.no-results h3 { font-size: 16px; color: var(--text-mid); margin-bottom: 6px; }

.loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-lt);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7"/></svg>
    </div>
    <div class="logo-text">Developer Zone<br><span>Code Examples</span></div>
  </div>
  <div class="header-divider"></div>
  <div class="search-wrap">
    <span class="search-icon">&#x2315;</span>
    <input type="text" id="searchInput" placeholder="Search examples, devices, peripherals…" autocomplete="off">
  </div>
  <div class="result-count-header" id="headerCount">Loading…</div>
</header>

<div class="page">
  <aside>

    <!-- PRODUCT LEVELS (hierarchical) -->
    <div class="sidebar-section">
      <div class="sidebar-label">
        Product Family
        <button id="clearProducts" onclick="clearHierarchy('prod')">Clear</button>
      </div>
      <div class="level-row">
        <label>Level 1 — Category</label>
        <select id="prod-l1" onchange="onLevelChange('prod',1)"><option value="">All</option></select>
      </div>
      <div class="level-row">
        <label>Level 2 — Family</label>
        <select id="prod-l2" onchange="onLevelChange('prod',2)" disabled><option value="">All</option></select>
      </div>
      <div class="level-row">
        <label>Level 3 — Sub-Family</label>
        <select id="prod-l3" onchange="onLevelChange('prod',3)" disabled><option value="">All</option></select>
      </div>
      <div class="level-row">
        <label>Level 4 — Device</label>
        <select id="prod-l4" onchange="onLevelChange('prod',4)" disabled><option value="">All</option></select>
      </div>
    </div>

    <!-- APPLICATION LEVELS (hierarchical) -->
    <div class="sidebar-section">
      <div class="sidebar-label">
        Application
        <button id="clearApps" onclick="clearHierarchy('app')">Clear</button>
      </div>
      <div class="level-row">
        <label>Level 1 — Segment</label>
        <select id="app-l1" onchange="onLevelChange('app',1)"><option value="">All</option></select>
      </div>
      <div class="level-row">
        <label>Level 2 — Sub-Application</label>
        <select id="app-l2" onchange="onLevelChange('app',2)" disabled><option value="">All</option></select>
      </div>
      <div class="level-row">
        <label>Level 3 — Function</label>
        <select id="app-l3" onchange="onLevelChange('app',3)" disabled><option value="">All</option></select>
      </div>
    </div>

    <!-- BOARD / KIT -->
    <div class="sidebar-section">
      <div class="sidebar-label">
        Board / Kit
        <button id="clearBoard" onclick="clearBoard()">Clear</button>
      </div>
      <input type="text" class="board-search" id="boardSearch" placeholder="Search boards…" oninput="renderBoardList()">
      <ul class="filter-list filter-list-scroll" id="filter-board"></ul>
    </div>

    <!-- LANGUAGE -->
    <div class="sidebar-section">
      <div class="sidebar-label">
        Language
        <button id="clearLang" onclick="clearLang()">Clear</button>
      </div>
      <ul class="filter-list filter-list-scroll" id="filter-lang"></ul>
    </div>

  </aside>

  <main>
    <div class="active-filters" id="activeFilters"></div>
    <div class="toolbar">
      <div class="toolbar-left" id="resultLabel">Loading…</div>
      <div class="toolbar-right">
        <label><input type="checkbox" id="hideArchived" checked onchange="currentPage=1;render()"> Hide archived</label>
        <div class="sort-wrap">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect" onchange="render()">
            <option value="stars">Stars</option>
            <option value="updated">Updated</option>
            <option value="az">A–Z</option>
          </select>
        </div>
      </div>
    </div>
    <div class="results" id="results"><div class="loading">Loading repository data…</div></div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script>
// ── STATE ─────────────────────────────────────────────
let repos = [];
let currentPage = 1;
const PAGE_SIZE = 30;

let appFilter  = [null, null, null];
let prodFilter = [null, null, null, null];
let boardFilter = new Set();
let langFilter = new Set();
let searchQuery = "";

// Board data
let boardCounts = {};
let boardList = [];

// ── BOARD PATTERN ─────────────────────────────────────
const BOARD_RE = /^(cy8c|cyw|kit[-_]|kp|cyble|cyw9|xmc|eval_)/i;

function extractBoards(r) {
  return r.topics.filter(t => BOARD_RE.test(t));
}

// ── LOAD DATA ─────────────────────────────────────────
fetch('repos.json')
  .then(r => r.json())
  .then(data => {
    repos = data;
    repos.forEach(r => { r._boards = extractBoards(r); });
    initFilters();
    render();
  })
  .catch(err => {
    document.getElementById('results').innerHTML =
      `<div class="no-results"><h3>Failed to load data</h3><p>${err.message}</p></div>`;
  });

// ── HIERARCHY HELPERS ─────────────────────────────────
function getUniqueAtLevel(field, level, parentSelections) {
  const vals = new Set();
  repos.forEach(r => {
    r[field].forEach(path => {
      if (path.length <= level) return;
      let match = true;
      for (let i = 0; i < level; i++) {
        if (parentSelections[i] && path.length > i && path[i] !== parentSelections[i]) {
          match = false;
          break;
        }
      }
      if (match) vals.add(path[level]);
    });
  });
  return [...vals].sort();
}

function populateSelect(id, options, selected) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">All</option>';
  options.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    if (v === selected) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.disabled = false;
}

function disableSelect(id) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">All</option>';
  sel.disabled = true;
}

// ── INIT FILTERS ──────────────────────────────────────
function initFilters() {
  populateSelect('prod-l1', getUniqueAtLevel('products', 0, []), null);
  disableSelect('prod-l2');
  disableSelect('prod-l3');
  disableSelect('prod-l4');

  populateSelect('app-l1', getUniqueAtLevel('apps', 0, []), null);
  disableSelect('app-l2');
  disableSelect('app-l3');

  // Build board counts
  boardCounts = {};
  repos.forEach(r => {
    r._boards.forEach(b => { boardCounts[b] = (boardCounts[b] || 0) + 1; });
  });
  boardList = Object.keys(boardCounts).sort((a, b) => boardCounts[b] - boardCounts[a]);
  renderBoardList();

  // Languages
  const langCount = {};
  repos.forEach(r => { if (r.lang) langCount[r.lang] = (langCount[r.lang] || 0) + 1; });
  const langs = Object.keys(langCount).sort((a, b) => langCount[b] - langCount[a]);
  const ul = document.getElementById('filter-lang');
  ul.innerHTML = '';
  langs.forEach(lang => {
    const li = document.createElement('li');
    li.className = 'filter-item';
    const id = 'lang_' + lang.replace(/[^a-zA-Z0-9]/g, '_');
    li.innerHTML = `
      <input type="checkbox" id="${id}">
      <label for="${id}">
        <span class="checkmark"></span>
        ${lang} <span class="filter-count">${langCount[lang]}</span>
      </label>
    `;
    li.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) langFilter.add(lang);
      else langFilter.delete(lang);
      currentPage = 1;
      updateClearButtons();
      render();
    });
    ul.appendChild(li);
  });

  updateClearButtons();
}

// ── BOARD LIST ────────────────────────────────────────
function renderBoardList() {
  const query = (document.getElementById('boardSearch').value || '').toLowerCase();
  const ul = document.getElementById('filter-board');
  ul.innerHTML = '';
  const shown = boardList.filter(b => !query || b.includes(query)).slice(0, 40);
  shown.forEach(board => {
    const li = document.createElement('li');
    li.className = 'filter-item';
    const id = 'board_' + board.replace(/[^a-zA-Z0-9]/g, '_');
    const checked = boardFilter.has(board);
    li.innerHTML = `
      <input type="checkbox" id="${id}" ${checked ? 'checked' : ''}>
      <label for="${id}">
        <span class="checkmark"></span>
        ${board} <span class="filter-count">${boardCounts[board]}</span>
      </label>
    `;
    li.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) boardFilter.add(board);
      else boardFilter.delete(board);
      currentPage = 1;
      updateClearButtons();
      render();
    });
    ul.appendChild(li);
  });
}

// ── LEVEL CHANGE HANDLER ──────────────────────────────
function onLevelChange(type, level) {
  const prefix = type === 'app' ? 'app' : 'prod';
  const field = type === 'app' ? 'apps' : 'products';
  const filter = type === 'app' ? appFilter : prodFilter;
  const maxLevel = type === 'app' ? 3 : 4;

  const sel = document.getElementById(`${prefix}-l${level}`);
  const val = sel.value || null;
  filter[level - 1] = val;

  for (let i = level; i < maxLevel; i++) {
    filter[i] = null;
    disableSelect(`${prefix}-l${i + 1}`);
  }

  if (val && level < maxLevel) {
    const parentSel = filter.slice(0, level);
    const options = getUniqueAtLevel(field, level, parentSel);
    if (options.length > 0) {
      populateSelect(`${prefix}-l${level + 1}`, options, null);
    }
  }

  currentPage = 1;
  updateClearButtons();
  render();
}

function clearHierarchy(type) {
  if (type === 'app') {
    appFilter = [null, null, null];
    populateSelect('app-l1', getUniqueAtLevel('apps', 0, []), null);
    disableSelect('app-l2');
    disableSelect('app-l3');
  } else {
    prodFilter = [null, null, null, null];
    populateSelect('prod-l1', getUniqueAtLevel('products', 0, []), null);
    disableSelect('prod-l2');
    disableSelect('prod-l3');
    disableSelect('prod-l4');
  }
  currentPage = 1;
  updateClearButtons();
  render();
}

function clearBoard() {
  boardFilter.clear();
  document.getElementById('boardSearch').value = '';
  renderBoardList();
  currentPage = 1;
  updateClearButtons();
  render();
}

function clearLang() {
  langFilter.clear();
  document.querySelectorAll('#filter-lang input[type=checkbox]').forEach(cb => cb.checked = false);
  currentPage = 1;
  updateClearButtons();
  render();
}

function updateClearButtons() {
  document.getElementById('clearProducts').classList.toggle('visible', prodFilter.some(v => v));
  document.getElementById('clearApps').classList.toggle('visible', appFilter.some(v => v));
  document.getElementById('clearBoard').classList.toggle('visible', boardFilter.size > 0);
  document.getElementById('clearLang').classList.toggle('visible', langFilter.size > 0);
}

// ── CHIPS ─────────────────────────────────────────────
function renderChips() {
  const container = document.getElementById('activeFilters');
  container.innerHTML = '';
  let total = 0;

  const prodActive = prodFilter.filter(v => v);
  if (prodActive.length) {
    total++;
    container.appendChild(makeChip('Product', prodActive.join(' \u203a '), () => clearHierarchy('prod')));
  }

  const appActive = appFilter.filter(v => v);
  if (appActive.length) {
    total++;
    container.appendChild(makeChip('App', appActive.join(' \u203a '), () => clearHierarchy('app')));
  }

  boardFilter.forEach(board => {
    total++;
    container.appendChild(makeChip('Board', board, () => {
      boardFilter.delete(board);
      renderBoardList();
      currentPage = 1;
      updateClearButtons();
      render();
    }));
  });

  langFilter.forEach(lang => {
    total++;
    container.appendChild(makeChip('Lang', lang, () => {
      langFilter.delete(lang);
      const cb = document.querySelector(`#lang_${lang.replace(/[^a-zA-Z0-9]/g, '_')}`);
      if (cb) cb.checked = false;
      currentPage = 1;
      updateClearButtons();
      render();
    }));
  });

  if (searchQuery) {
    total++;
    container.appendChild(makeChip('Search', `"${searchQuery}"`, () => {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      currentPage = 1;
      render();
    }));
  }

  if (total > 1) {
    const btn = document.createElement('button');
    btn.className = 'clear-all';
    btn.textContent = 'Clear all';
    btn.addEventListener('click', () => {
      clearHierarchy('app');
      clearHierarchy('prod');
      clearBoard();
      clearLang();
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      render();
    });
    container.appendChild(btn);
  }
}

function makeChip(label, text, onRemove) {
  const chip = document.createElement('div');
  chip.className = 'filter-chip';
  chip.innerHTML = `<span style="font-size:10px;color:#888;margin-right:2px">${label}</span>${escapeHtml(text)}<button class="chip-remove">&times;</button>`;
  chip.querySelector('button').addEventListener('click', onRemove);
  return chip;
}

// ── FILTERING ─────────────────────────────────────────
function matchesHierarchy(paths, filterArr) {
  const activeLevels = [];
  filterArr.forEach((v, i) => { if (v) activeLevels.push([i, v]); });
  if (activeLevels.length === 0) return true;
  return paths.some(path =>
    activeLevels.every(([lvl, val]) => path.length > lvl && path[lvl] === val)
  );
}

function filtered() {
  const hideArch = document.getElementById('hideArchived').checked;
  return repos.filter(r => {
    if (hideArch && r.archived) return false;
    if (!matchesHierarchy(r.products, prodFilter)) return false;
    if (!matchesHierarchy(r.apps, appFilter)) return false;
    if (boardFilter.size > 0) {
      const hasBoard = r._boards.some(b => boardFilter.has(b));
      if (!hasBoard) return false;
    }
    if (langFilter.size > 0 && !langFilter.has(r.lang)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = `${r.name} ${r.desc} ${r.topics.join(' ')} ${r.products.map(p=>p.join(' ')).join(' ')} ${r.apps.map(a=>a.join(' ')).join(' ')}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function sorted(arr) {
  const by = document.getElementById('sortSelect').value;
  return [...arr].sort((a, b) => {
    if (by === 'stars')   return b.stars - a.stars;
    if (by === 'updated') return b.updated.localeCompare(a.updated);
    if (by === 'az')      return a.name.localeCompare(b.name);
    return 0;
  });
}

// ── RENDER ────────────────────────────────────────────
function render() {
  renderChips();
  const items = sorted(filtered());
  const total = items.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('results');

  document.getElementById('headerCount').textContent = `${total} example${total !== 1 ? 's' : ''}`;
  document.getElementById('resultLabel').innerHTML = total === 0
    ? 'No results'
    : `Showing <strong>${start + 1}\u2013${start + pageItems.length}</strong> of ${total}`;

  if (total === 0) {
    container.innerHTML = `<div class="no-results"><h3>No examples match</h3><p>Try adjusting your filters or search term.</p></div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  container.innerHTML = pageItems.map(r => {
    const appLabel = r.apps.length ? r.apps[0][r.apps[0].length - 1] : '';
    const prodLabel = r.products.length ? r.products[0].slice(0, 2).join(' \u203a ') : '';
    const boardTags = r._boards.slice(0, 2).map(b => `<span class="tag tag-board">${escapeHtml(b)}</span>`).join('');
    return `
    <div class="card${r.archived ? ' archived' : ''}">
      <div class="card-top">
        <div class="card-icon">${langIcon(r.lang)}</div>
        <div class="card-title-wrap">
          <div class="card-title" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</div>
          <div class="card-org">${escapeHtml(r.full_name)}</div>
        </div>
      </div>
      <div class="card-desc">${escapeHtml(r.desc)}</div>
      <div class="card-tags">
        ${appLabel ? `<span class="tag tag-app">${escapeHtml(appLabel)}</span>` : ''}
        ${prodLabel ? `<span class="tag tag-product">${escapeHtml(prodLabel)}</span>` : ''}
        ${boardTags}
        ${r.lang ? `<span class="tag tag-lang">${escapeHtml(r.lang)}</span>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-meta">
          <span>&#9733; ${r.stars}</span>
          <span>&#x1F504; ${r.forks}</span>
          <span>${relativeTime(r.updated)}</span>
          ${r.archived ? '<span style="color:#b45309">Archived</span>' : ''}
        </div>
        <a href="${r.url}" target="_blank" rel="noopener" class="btn-github">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          View
        </a>
      </div>
    </div>`;
  }).join('');

  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  pag.innerHTML = `
    <button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">&laquo; Prev</button>
    <span class="page-info">Page ${currentPage} of ${totalPages}</span>
    <button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">Next &raquo;</button>
  `;
}

function goPage(p) { currentPage = p; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function relativeTime(dateStr) {
  if (!dateStr) return '';
  const days = Math.round((new Date() - new Date(dateStr)) / 86400000);
  if (days <= 0) return 'today';
  if (days < 30) return `${days}d ago`;
  if (days < 365) return `${Math.round(days/30)}mo ago`;
  return `${Math.round(days/365)}y ago`;
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function langIcon(lang) {
  const m = {'C':'&#x1F1E8;','C++':'&#x2795;','Python':'&#x1F40D;','Java':'&#x2615;','JavaScript':'JS','TypeScript':'TS','Rust':'&#x1F980;','Makefile':'&#x1F527;'};
  return m[lang] || '&#x1F4C1;';
}

// ── SEARCH ────────────────────────────────────────────
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = e.target.value.trim();
    currentPage = 1;
    render();
  }, 200);
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});
</script>
