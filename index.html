<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Examples — Infineon Developer Zone</title>
<style>
/* ── Reset & Base ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:    #009B3A;
  --green-lt: #e8f7ee;
  --green-dk: #007A2F;
  --text:     #1a1a1a;
  --text-mid: #555;
  --text-lt:  #888;
  --border:   #e0e0e0;
  --bg:       #f7f8f9;
  --white:    #ffffff;
  --tag-bg:   #f0f0f0;
  --radius:   6px;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; }

/* ── Header ───────────────────────────────────────── */
header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 32px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.logo-mark {
  width: 28px;
  height: 28px;
  background: var(--green);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-mark svg { fill: white; }

.logo-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}
.logo-text span { color: var(--green); }

.header-divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  flex-shrink: 0;
}

.search-wrap {
  flex: 1;
  max-width: 540px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px 0 36px;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--green); background: white; }
.search-wrap input::placeholder { color: var(--text-lt); }

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-lt);
  pointer-events: none;
  font-size: 14px;
}

.result-count-header {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-lt);
  flex-shrink: 0;
}

/* ── Page layout ──────────────────────────────────── */
.page {
  display: grid;
  grid-template-columns: 232px 1fr;
  gap: 0;
  max-width: 1280px;
  margin: 0 auto;
  min-height: calc(100vh - 56px);
}

/* ── Sidebar ──────────────────────────────────────── */
aside {
  background: var(--white);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}

.sidebar-section {
  padding: 0 16px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.sidebar-section:last-child { border-bottom: none; }

.sidebar-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-lt);
  padding: 12px 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-label button {
  font-size: 10px;
  font-weight: 600;
  color: var(--green);
  background: none;
  border: none;
  padding: 0;
  text-transform: none;
  letter-spacing: 0;
  display: none;
}
.sidebar-label button.visible { display: block; }

.filter-list { list-style: none; display: flex; flex-direction: column; gap: 1px; }

.filter-item label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 4px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: background 0.1s;
  user-select: none;
}
.filter-item label:hover { background: var(--bg); }
.filter-item input[type="checkbox"] { display: none; }

.checkmark {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
  background: white;
}
.filter-item input:checked + label .checkmark {
  background: var(--green);
  border-color: var(--green);
}
.filter-item input:checked + label .checkmark::after {
  content: '';
  display: block;
  width: 9px;
  height: 5px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px, -1px);
}
.filter-item input:checked + label { color: var(--green-dk); font-weight: 500; }

.filter-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-lt);
  font-weight: 400;
}

/* ── Main content ─────────────────────────────────── */
main {
  padding: 20px 28px 40px;
}

/* Active filters row */
.active-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 32px;
  margin-bottom: 16px;
}

.filter-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px 3px 10px;
  background: var(--green-lt);
  border: 1px solid #b2ddc4;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--green-dk);
}
.filter-chip .chip-remove {
  background: none;
  border: none;
  padding: 0;
  line-height: 1;
  color: var(--green);
  font-size: 14px;
  display: flex;
  align-items: center;
  opacity: 0.7;
}
.filter-chip .chip-remove:hover { opacity: 1; }

.clear-all {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-lt);
  background: none;
  border: none;
  padding: 2px 4px;
  border-radius: 4px;
  margin-left: 4px;
}
.clear-all:hover { color: var(--text); background: var(--bg); }

/* Toolbar row */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.toolbar-left {
  font-size: 13px;
  color: var(--text-mid);
}
.toolbar-left strong { color: var(--text); }

.sort-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.sort-wrap label { font-size: 12px; color: var(--text-lt); }
.sort-wrap select {
  font-size: 12px;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 8px;
  background: white;
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.sort-wrap select:focus { border-color: var(--green); }

/* Result grid */
.results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}

/* Result card */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover {
  border-color: #b0d4be;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-icon {
  width: 32px;
  height: 32px;
  border-radius: 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
}

.card-title-wrap { flex: 1; min-width: 0; }

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-org {
  font-size: 11px;
  color: var(--text-lt);
  margin-top: 1px;
}

.card-desc {
  font-size: 12px;
  color: var(--text-mid);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 500;
  line-height: 1.6;
}
.tag-app      { background: #eef2ff; color: #3730a3; }
.tag-product  { background: #fef3c7; color: #92400e; }
.tag-board    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.tag-lang     { background: var(--tag-bg); color: var(--text-mid); }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 6px;
  border-top: 1px solid var(--bg);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--text-lt);
}
.card-meta span { display: flex; align-items: center; gap: 3px; }

.btn-github {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-mid);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.btn-github:hover {
  background: var(--text);
  border-color: var(--text);
  color: white;
}

/* No results */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-lt);
}
.no-results h3 { font-size: 16px; color: var(--text-mid); margin-bottom: 6px; }
.no-results p { font-size: 13px; }

/* ── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
</style>
</head>

<!-- HEADER -->

// ── FILTER METADATA ──────────────────────────────────────────────────
const filterGroups = {
  app:     [...new Set(repos.map(r => r.app))].sort(),
  product: [...new Set(repos.map(r => r.product))].sort(),
  board:   [...new Set(repos.map(r => r.board))].sort()
};

let activeFilters = { app: new Set(), product: new Set(), board: new Set() };
let searchQuery = "";

// ── COUNT PER FILTER ──────────────────────────────────────────────────
function countForValue(group, value) {
  const otherActive = {
    app:     group === 'app'     ? activeFilters.app     : new Set([...activeFilters.app]),
    product: group === 'product' ? activeFilters.product : new Set([...activeFilters.product]),
    board:   group === 'board'   ? activeFilters.board   : new Set([...activeFilters.board]),
  };
  // temporarily pretend this value is selected in its group
  const testFilters = {
    app:     group === 'app'     ? new Set([value]) : activeFilters.app,
    product: group === 'product' ? new Set([value]) : activeFilters.product,
    board:   group === 'board'   ? new Set([value]) : activeFilters.board,
  };
  return filtered(testFilters).length;
}

// ── BUILD SIDEBAR ──────────────────────────────────────────────────────
function buildSidebar() {
  ['app', 'product', 'board'].forEach(group => {
    const ul = document.getElementById(`filter-${group}`);
    ul.innerHTML = '';
    filterGroups[group].forEach(val => {
      const count = countForValue(group, val);
      const checked = activeFilters[group].has(val);
      const li = document.createElement('li');
      li.className = 'filter-item';
      li.innerHTML = `
        <input type="checkbox" id="f_${group}_${val.replace(/\s/g,'_')}" ${checked ? 'checked' : ''}>
        <label for="f_${group}_${val.replace(/\s/g,'_')}">
          <span class="checkmark"></span>
          ${val}
          <span class="filter-count">${count}</span>
        </label>
      `;
      li.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) activeFilters[group].add(val);
        else activeFilters[group].delete(val);
        updateClearButtons();
        render();
        buildSidebar(); // update counts
      });
      ul.appendChild(li);
    });
  });
}

function updateClearButtons() {
  ['app', 'product', 'board'].forEach(group => {
    const btn = document.getElementById(`clear${group.charAt(0).toUpperCase() + group.slice(1)}`);
    btn.classList.toggle('visible', activeFilters[group].size > 0);
  });
}

function clearGroup(group) {
  activeFilters[group].clear();
  updateClearButtons();
  render();
  buildSidebar();
}

// ── ACTIVE FILTER CHIPS ───────────────────────────────────────────────
const groupLabels = { app: 'App', product: 'Product', board: 'Board' };

function renderChips() {
  const container = document.getElementById('activeFilters');
  container.innerHTML = '';
  let total = 0;
  ['app', 'product', 'board'].forEach(group => {
    activeFilters[group].forEach(val => {
      total++;
      const chip = document.createElement('div');
      chip.className = 'filter-chip';
      chip.innerHTML = `
        <span style="font-size:10px;color:#888;margin-right:2px">${groupLabels[group]}</span>
        ${val}
        <button class="chip-remove" title="Remove">×</button>
      `;
      chip.querySelector('button').addEventListener('click', () => {
        activeFilters[group].delete(val);
        updateClearButtons();
        render();
        buildSidebar();
      });
      container.appendChild(chip);
    });
  });

  if (searchQuery) {
    const chip = document.createElement('div');
    chip.className = 'filter-chip';
    chip.innerHTML = `<span style="font-size:10px;color:#888;margin-right:2px">Search</span>"${searchQuery}" <button class="chip-remove" title="Remove">×</button>`;
    chip.querySelector('button').addEventListener('click', () => {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      render();
      buildSidebar();
    });
    container.appendChild(chip);
    total++;
  }

  if (total > 1) {
    const btn = document.createElement('button');
    btn.className = 'clear-all';
    btn.textContent = 'Clear all';
    btn.addEventListener('click', () => {
      activeFilters = { app: new Set(), product: new Set(), board: new Set() };
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      updateClearButtons();
      render();
      buildSidebar();
    });
    container.appendChild(btn);
  }
}

// ── FILTER + SORT ─────────────────────────────────────────────────────
function filtered(f = activeFilters) {
  return repos.filter(r => {
    if (f.app.size     > 0 && !f.app.has(r.app))         return false;
    if (f.product.size > 0 && !f.product.has(r.product)) return false;
    if (f.board.size   > 0 && !f.board.has(r.board))     return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!r.name.toLowerCase().includes(q) &&
          !r.desc.toLowerCase().includes(q) &&
          !r.app.toLowerCase().includes(q) &&
          !r.product.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sorted(arr) {
  const by = document.getElementById('sortSelect').value;
  return [...arr].sort((a, b) => {
    if (by === 'stars')   return b.stars - a.stars;
    if (by === 'updated') return b.updated.localeCompare(a.updated);
    if (by === 'az')      return a.name.localeCompare(b.name);
    return 0; // relevance = original order
  });
}

function relativeTime(dateStr) {
  const d = new Date(dateStr);
  const now = new Date('2026-05-13');
  const days = Math.round((now - d) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30)  return `${days}d ago`;
  if (days < 365) return `${Math.round(days/30)}mo ago`;
  return `${Math.round(days/365)}y ago`;
}

// ── RENDER RESULTS ────────────────────────────────────────────────────
function render() {
  renderChips();
  const items = sorted(filtered());
  const container = document.getElementById('results');
  const count = items.length;

  document.getElementById('headerCount').textContent = `${count} example${count !== 1 ? 's' : ''}`;
  document.getElementById('resultLabel').innerHTML = `Showing <strong>${count}</strong> of ${repos.length} examples`;

  if (count === 0) {
    container.innerHTML = `
      <div class="no-results">
        <h3>No examples match</h3>
        <p>Try adjusting your filters or search term.</p>
      </div>`;
    return;
  }

  container.innerHTML = items.map(r => `
    <div class="card">
      <div class="card-top">
        <div class="card-icon">${r.icon}</div>
        <div class="card-title-wrap">
          <div class="card-title" title="${r.name}">${r.name}</div>
          <div class="card-org">Infineon/${r.name}</div>
        </div>
      </div>
      <div class="card-desc">${r.desc}</div>
      <div class="card-tags">
        <span class="tag tag-app">${r.app}</span>
        <span class="tag tag-product">${r.product}</span>
        <span class="tag tag-board">${r.board}</span>
        <span class="tag tag-lang">${r.lang}</span>
      </div>
      <div class="card-footer">
        <div class="card-meta">
          <span>★ ${r.stars}</span>
          <span>Updated ${relativeTime(r.updated)}</span>
        </div>
        <button class="btn-github">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
            -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64
            -.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18
            1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56
            .82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
            0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          View on GitHub
        </button>
      </div>
    </div>
  `).join('');
}

// ── SEARCH ────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
  buildSidebar();
});

// ── INIT ──────────────────────────────────────────────────────────────
buildSidebar();
render();
</script>
</body>
</html>
